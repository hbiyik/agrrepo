name: release armv7h

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1,5,9,13,17,21 * * *"

permissions:
  contents: write

jobs:
  call:
    uses: ./.github/workflows/release.yaml
    with:
      arch: alarm-armv7h
      packages: |-
        ["gitweb-dlagent",
        "librga-multi",
        "acestream-media-bin",
        "dri2to3-git",
        "bcm4335-firmware",
        "gl4es-git",
        "kodi-mpp-git",
        "libmali-valhall-g610-base libmali-valhall-g610-dummy libmali-valhall-g610-gbm libmali-valhall-g610-x11-gbm libmali-valhall-g610-wayland-gbm libmali-valhall-g610-x11-wayland-gbm",
        "mesa-git",
        "mesa-panfork-git",
        "mpp-git",
        "ffmpeg-mpp",
        "libv4l-rkmpp-git",
        "v4l-utils-mpp",
        "cubeb cubeb-docs",
        "agr-git",
        "mpv-mpp",
        "espeak-ng-git",
        "onnxruntime-cpu",
        "python-onnxruntime-cpu",
        "python-piper-tts-git",
        "python-av",
        "python-sentence-stream-git",
        "python-tokenizers",
        "python-wyoming",
        "python-wyoming-piper",
        "home-assistant-core",
        "home-assistant-hacs",
        "python-home-assistant-frontend",
        "tvheadend-git",
        "libdvbcsa-git"]
