name: release arch-x86_64

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2,6,10,14,18,22 * * *"
    
permissions:
  contents: write

jobs:
  call:
    uses: ./.github/workflows/release.yaml
    with:
      arch: arch-x86_64
      packages: |
        [
          "gitweb-dlagent",
          "librga-multi",
          "acestream-media-bin",
          "dri2to3-git",
          "bcm4335-firmware",
          "gl4es-git",
          "kodi-mpp-git",
          "mesa-git",
          "mesa-panfork-git",
          "mpp-git",
          "ffmpeg-mpp",
          "libv4l-rkmpp-git",
          "v4l-utils-mpp",
          "sunshine-mpp-git",
          "cubeb cubeb-docs dolphin-emu-git dolphin-emu-nogui-git dolphin-emu-tool",
          "agr-git",
          "mpv-mpp",
          "plasma-nano",
          "plasma-bigscreen-git",
          "ctranslate2",
          "python-ctranslate2",
          "espeak-ng-git",
          "onednn",
          "onnxruntime-cpu",
          "python-onnxruntime-cpu",
          "python-piper-tts-git",
          "python-av",
          "python-faster-whisper",
          "python-sentence-stream-git",
          "python-tokenizers",
          "python-wyoming",
          "python-wyoming-faster-whisper",
          "python-wyoming-piper",
          "home-assistant-core",
          "home-assistant-hacs",
          "python-home-assistant-frontend",
          "tvheadend-git",
          "libdvbcsa-git"
        ]

